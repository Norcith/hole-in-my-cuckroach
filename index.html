      .invis_link {

        text-decoration: none;

    <script>

      function updateLinks() {
        const toUpdate = document.querySelectorAll(".updCandidate");
        toUpdate.forEach(area => {
          area.querySelectorAll(".w").forEach(link => {
            link.addEventListener("click", event => {
              event.preventDefault();
              show(link.getAttribute("href"))
            })
          })  
        })
      }
      
      function show(page) {
        const main = document.getElementById("main")
        let newPage = document.getElementById("t_404")
        const template = document.getElementById(`t_${page}`);
        if (template) {
          newPage = template;
        }
        main.replaceChildren(newPage.content.cloneNode(true));
        updateLinks()
      }
    </script>
  </head>

    <template id="t_blog">
      <script>
        let i = 0
        function b_show() {
          const target = i + 10
          const content = document.getElementById("b_content");
          for (; i < target; i++) {
              const random = Math.floor(Math.random() * 1000);
              const day = Math.floor(Date.now() / 86400000) - 6339 - i;
              const htmlString = `
  <div style="display: flex; align-items: center; gap: 16px;"><img src="https://picsum.photos/seed/${random}/50" alt="Thumbnail"><div><h4 style="margin: 0 0 4px 0;">It's still there</h4><p style="margin: 0;">Jour ${day} – Je sais toujours pas comment le retirer</p></div></div>
<br>`;
            content.insertAdjacentHTML('beforeend', htmlString);

          }
        }
      </script>
      <h2>Blog</h2>
      <div id="b_content"></div>
      <button onClick="b_show()">Afficher plus</button>
      <script>b_show()</script>
    </template>
    <template id="t_photos">
      <script>
        function p_new() {
          const random = Math.floor(Math.random() * 10000);
          const blur = Number(document.getElementById("photo_ia").value);
          const isChecked = document.getElementById("photo_iv").checked;

          const params = [blur && `blur=${blur}`, isChecked && "grayscale"].filter(Boolean);
          const param_start = params.length ? "?" : "";
          const param_content = params.join("&");
          document.getElementById("photo_main").src =
            `https://picsum.photos/seed/${random}/350/200${param_start}${param_content}`;
        }
      </script>
      <h2>Album de vacances</h2>
      <img id="photo_main" src="https://picsum.photos/350/200" />
      <br />
      <button onClick="p_new()">non je l'aime pas celle-là</button>

        <input
